<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>律师技能管理台 · wife-legal</title>
<!-- 内联 SVG 图标：避免浏览器默认请求 /favicon.ico 产生 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f4bd8'/%3E%3Cpath d='M16 7v18M9 12h14M11 12l-4 8h8zM21 12l-4 8h8z' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ===== 设计变量：中性灰底 + 单一强调色，保持信息优先 ===== */
:root{
    --bg:#f4f6fa; --panel:#ffffff; --ink:#111827; --sub:#667085; --mute:#98a2b3;
    --brand:#2f4bd8; --brand-soft:#eef1fe; --line:#e4e8f0; --line-2:#f0f3f8;
    --ok:#0f7b57; --ok-soft:#e8f7f0; --warn:#b45309; --warn-soft:#fdf4e8;
    --danger:#b42318; --danger-soft:#fdecea;
    --mono:"Cascadia Code",Consolas,"JetBrains Mono",monospace;
    --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 130px}
code{font-family:var(--mono)}

/* ===== 页头 ===== */
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:26px 0 18px}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.top .sub{font-size:12.5px;color:var(--sub);padding-bottom:3px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat{font-size:12.5px;color:var(--sub)}
.stat b{font-size:15px;color:var(--ink);font-weight:700}
.stat b.hot{color:var(--brand)}



/* ===== 工具条（吸顶） ===== */
.toolbar{position:sticky;top:0;z-index:30;background:rgba(244,246,250,.93);backdrop-filter:blur(10px);border-bottom:1px solid transparent;padding:10px 0 8px;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.toolbar.stuck{border-color:var(--line);box-shadow:0 4px 14px rgba(17,24,39,.04)}
.tbrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:190px;max-width:330px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 33px;font-size:12.5px;background:var(--panel);color:var(--ink);outline:none;font-family:inherit}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search::before{content:"\2315";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:15px;line-height:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{padding:8px 13px;border:0;background:transparent;font-size:12.5px;cursor:pointer;color:var(--sub);font-family:inherit;white-space:nowrap}
.seg button:hover{color:var(--brand)}
.seg button.on{background:var(--ink);color:#fff}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);cursor:pointer;user-select:none;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.switch input{width:15px;height:15px;accent-color:var(--warn);cursor:pointer}
.tbrow .spacer{margin-left:auto}
.resline{font-size:12px;color:var(--mute);white-space:nowrap}
.resline b{color:var(--ink)}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;cursor:pointer;color:var(--ink);font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.danger{color:var(--danger);border-color:#f6cfcb;background:var(--danger-soft)}

/* ===== 分类条 ===== */
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.cat{padding:5px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;cursor:pointer;color:var(--sub);transition:.12s}
.cat:hover{border-color:var(--brand);color:var(--brand)}
.cat.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.cat .n{font-size:11px;opacity:.75;margin-left:5px}
.scaninfo{font-size:12px;color:var(--ok);margin-top:7px}
.scaninfo:empty{display:none}

/* ===== 卡片视图 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;position:relative;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 2px 4px rgba(16,24,40,.04),0 8px 22px rgba(16,24,40,.07)}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.card.installed{border-left:3px solid var(--ok);padding-left:14px}
.r1{display:flex;align-items:flex-start;gap:9px}
.r1 input{width:16px;height:16px;margin-top:3px;accent-color:var(--brand);flex:none;cursor:pointer}
.r1 .name{font-family:var(--mono);font-size:13.5px;font-weight:700;word-break:break-all;flex:1;line-height:1.5}
.badge{flex:none;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;margin-top:2px}
.badge.large{background:var(--warn-soft);color:var(--warn)}
.badge.inst{background:var(--ok-soft);color:var(--ok);font-weight:600}
.badge.en{background:#eef2ff;color:#3b4bc4}
.card .note{font-size:12.5px;color:var(--sub);margin:7px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--mute)}
.card .meta .sk{color:var(--ok);font-weight:600}
.card .meta a{color:var(--brand);text-decoration:none}
.card .meta a:hover{text-decoration:underline}
.card .meta a.ccs{background:var(--brand-soft);border-radius:6px;padding:1px 7px;font-weight:600}
.card details.cg{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px;color:var(--sub)}
.card details.cg summary{cursor:pointer;color:var(--brand);font-size:12px;list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.card details.cg summary::-webkit-details-marker{display:none}
.card details.cg summary::before{content:"\25B8";font-size:9px;transition:transform .15s}
.card details.cg[open] summary::before{transform:rotate(90deg)}
.card details.cg ul{margin:7px 0 0;padding-left:16px}
.card details.cg li{margin-bottom:3px;line-height:1.55}
.card details.cg li b{color:var(--ink);font-weight:600}
.card details.cg .no{margin-top:8px;padding-top:8px;border-top:1px dotted var(--line)}
.card details.cg .no li b{color:var(--danger)}

/* ===== 选型表视图 ===== */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 180px)}
.seltable{width:100%;min-width:1020px;border-collapse:separate;border-spacing:0;font-size:12.5px}
.seltable th{position:sticky;top:0;z-index:2;background:#f7f9fc;text-align:left;font-weight:600;font-size:11.5px;color:var(--sub);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.seltable td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--sub)}
.seltable tbody tr:last-child td{border-bottom:0}
.seltable tbody tr:hover td{background:#fafbfe}
.seltable .r{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:700;word-break:break-all}
.seltable .d{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.5}
.seltable ul{margin:0;padding-left:14px}
.seltable li{margin-bottom:4px;line-height:1.55}
.seltable li b{color:var(--ink);font-weight:600}
.seltable ul.no li b{color:var(--danger)}
.seltable .cat2{white-space:nowrap;color:var(--ink);font-size:12px}
.empty-tip{padding:34px 16px;text-align:center;color:var(--mute);font-size:13px}

/* ===== 状态导入弹层 ===== */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:22px 24px;box-shadow:0 20px 50px rgba(17,24,39,.25)}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.modal pre{background:#0a1020;color:#dfe6f3;border:1px solid #27314b;border-radius:9px;padding:10px 12px;font-family:var(--mono);font-size:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:100px;margin-bottom:10px}
.modal textarea{width:100%;height:130px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--mono);font-size:12px;resize:vertical;outline:none}
.modal textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.modal .acts{display:flex;gap:9px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}

/* ===== 底部命令面板 ===== */
.cmdpanel{position:fixed;left:0;right:0;bottom:0;background:#0f1524;color:#e6ebf5;border-top:1px solid #26304a;transform:translateY(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:60;box-shadow:0 -10px 40px rgba(17,24,39,.3)}
.cmdpanel.open{transform:translateY(0)}
.cmdpanel .inner{max-width:1120px;margin:0 auto;padding:14px 20px 18px}
.cmdhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cmdhead .t{font-size:13.5px;font-weight:600}
.cmdhead .hint{font-size:11.5px;color:#8895b2}
.cmdhead #root{background:#141c2e;border:1px solid #2b3550;border-radius:9px;padding:6px 10px;font-size:12px;color:#dbe4f3;outline:none;width:210px;font-family:inherit}
.cmdhead #root::placeholder{color:#5f6b85}
.cmdhead #root:focus{border-color:var(--brand)}
.acts2{display:flex;border:1px solid #2b3550;border-radius:9px;overflow:hidden}
.acts2 button{padding:6px 12px;border:0;background:#182034;color:#93a0bd;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.acts2 button:hover{color:#dbe4f3}
.acts2 button.on{background:var(--brand);color:#fff}
.cmdhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.cmdhead .x{width:28px;height:28px;border-radius:8px;border:1px solid #2b3550;background:#182034;color:#93a0bd;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
.cmdhead .x:hover{color:#fff;border-color:#3d4a6b;background:#222c44}
.copy{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:7px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.copy:hover{filter:brightness(1.08)}
.copy.ok{background:var(--ok)}
.export{background:#1c2438;color:#c3cddf;border:1px solid #2b3550;border-radius:9px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.export:hover{border-color:#3d4a6b;color:#fff}
.export:disabled{opacity:.65;cursor:progress}
.zipmsg{display:none;margin-top:10px;padding-top:9px;border-top:1px dashed #2b3550;font-size:12px;line-height:1.75;color:#93a0bd;white-space:pre-wrap;word-break:break-all}
.zipmsg.show{display:block}
.zipmsg b{color:#dbe4f3}
.zipmsg .warn{color:#e0a33e}
#cmdOut{background:#080d18;border:1px solid #232c44;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;color:#d5e0f0;overflow:auto;white-space:pre-wrap;word-break:break-all;max-height:220px;line-height:1.7;margin:0}

/* ===== 悬浮按钮与提示 ===== */
.fab{position:fixed;right:24px;bottom:24px;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:13px 20px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(47,75,216,.38);z-index:40;display:flex;align-items:center;gap:8px;font-family:inherit}
.fab:hover{filter:brightness(1.06)}
.fab .cnt{background:rgba(255,255,255,.22);border-radius:999px;padding:0 8px;font-size:12px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-14px);background:var(--ink);color:#fff;padding:9px 20px;border-radius:10px;font-size:12.5px;opacity:0;transition:.25s;z-index:99;pointer-events:none;box-shadow:0 8px 24px rgba(17,24,39,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:760px){
    .top{align-items:flex-start}
    .top .right{margin-left:0;width:100%}
    .cmdline{flex-direction:column}
    .cmdline button{padding:10px}
    .search{max-width:none;flex:1 1 100%}
    .cmdhead .right{margin-left:0;width:100%}
    .cmdhead #root{width:100%}
    .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <h1>律师技能管理台</h1>
        <div class="sub">aukodeng-skill / wife-legal · 34 个技能库 · 10 个分类</div>
        <div class="right">
            <div class="stat">已选 <b class="hot" id="cnt">0</b></div>
            <div class="stat">已安装 <b id="instCnt">0</b></div>
        </div>
    </div>

    <div class="toolbar" id="toolbar">
        <div class="tbrow">
            <div class="search"><input type="text" id="q" placeholder="搜索库名 / 简介 / 使用场景"></div>
            <div class="seg" id="seg">
                <button data-os="win" class="on">Windows</button>
                <button data-os="mac">macOS / Linux</button>
            </div>
            <div class="seg" id="viewSeg">
                <button data-view="cards" class="on">卡片</button>
                <button data-view="table">选型表</button>
            </div>
            <label class="switch" title="large=1 的仓库技能数量巨大，默认不参与"><input type="checkbox" id="inclLarge"> 包含大型库</label>
            <div class="spacer"></div>
            <span class="resline" id="resCnt"></span>
            <button class="btn" id="scanBtn">导入本地状态</button>
        </div>
        <div class="cats" id="cats"></div>
        <div class="scaninfo" id="scanInfo"></div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="tablewrap" id="tableWrap" style="display:none"><table class="seltable" id="selTable"></table></div>
</div>

<button class="fab" id="fab">生成命令<span class="cnt" id="fabCnt">0</span></button>
<div class="cmdpanel" id="cmdpanel">
    <div class="inner">
        <div class="cmdhead">
            <span class="t">部署命令</span>
            <div class="acts2" id="actSeg">
                <button data-act="install" class="on">安装</button>
                <button data-act="update">更新</button>
                <button data-act="uninstall">删除</button>
                <button data-act="disable">停用</button>
                <button data-act="enable">启用进项目</button>
                <button data-act="scan">扫描命令</button>
            </div>
            <input type="text" id="root" placeholder="安装根目录（可选）">
            <span class="hint" id="hint"></span>
            <div class="right">
                <button class="export" id="ccsBtn" title="用官方深链接把勾选的每个库注册为 CC Switch 的 Skill 仓库（一库一条记录，CC Switch 会自动同步库内技能）">导入 CC Switch 仓库</button>
                <button class="export" id="zipBtn" title="把勾选的每个技能库各打成 ZIP 里的一个库目录，可直接在 CC Switch 的「从 ZIP 安装」里导入">下载 ZIP</button>
                <button class="export" id="exportBtn">导出配置</button>
                <button class="copy" id="copyBtn">复制命令</button>
                <button class="x" id="cmdClose" title="关闭（Esc）" aria-label="关闭">×</button>
            </div>
        </div>
        <pre id="cmdOut">（尚未选择任何技能仓）</pre>
        <div class="zipmsg" id="ccsMsg"></div>
        <div class="zipmsg" id="zipMsg"></div>
    </div>
</div>

<!-- 状态导入弹层 -->
<div class="modal" id="scanModal">
    <div class="box">
        <h3>导入本地已安装状态</h3>
        <p>第 1 步：在部署仓目录运行扫描命令，得到一段 JSON：</p>
        <pre id="scanCmdHint"></pre>
        <p>第 2 步：把 JSON 原样粘贴到下面（或选择扫描导出的文件），点「导入状态」：</p>
        <textarea id="scanInput" placeholder='{"type":"wife-legal-scan", ...}'></textarea>
        <div class="acts">
            <input type="file" id="scanFile" accept=".json,.txt" style="display:none">
            <button class="btn" id="scanPick">选择文件…</button>
            <button class="btn primary" id="scanImport">导入状态</button>
            <button class="btn" id="scanClose">关闭</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>

// ===== 小工具 =====
function esc(s)
{
    return String(s === null || s === undefined ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

let toastTimer = null;
function toast(msg)
{
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

// 扫描结果里每个仓的已安装 / 已启用信息（字段名做了兼容）
function scanRows()
{
    if (!scanState) return [];
    if (Array.isArray(scanState.installed)) return scanState.installed;
    if (Array.isArray(scanState.repos)) return scanState.repos;
    return [];
}
function installed(repo)
{
    return scanRows().some((x) => (x.repo || x.name) === repo);
}
function enabledCount(repo)
{
    const hit = scanRows().find((x) => (x.repo || x.name) === repo);
    if (!hit) return 0;
    if (typeof hit.enabled === "number") return hit.enabled;
    if (Array.isArray(hit.enabledSkills)) return hit.enabledSkills.length;
    if (Array.isArray(hit.links)) return hit.links.length;
    return 0;
}

const catCounts = {};
DATA.forEach((r) => { catCounts[r[1]] = (catCounts[r[1]] || 0) + 1; });

function renderCats()
{
    const el = document.getElementById("cats");
    el.innerHTML = "";
    const items = [["全部", DATA.length]].concat(Object.entries(catCounts));
    items.forEach(([name, n]) => {
        const b = document.createElement("div");
        b.className = "cat" + (name === cat ? " on" : "");
        b.innerHTML = esc(name) + '<span class="n">' + n + "</span>";
        b.onclick = () => { cat = name; renderCats(); render(); };
        el.appendChild(b);
    });
}

// ===== 文本加粗：把每条建议的首个分句（触发条件）加粗，便于快速扫读 =====
function boldLead(text)
{
    const s = String(text || "");
    const m = s.match(/^([^，、（(]+)/);
    if (!m || m[1].length >= s.length)
    {
        const b = document.createElement("b");
        b.textContent = s;
        return b;
    }
    const frag = document.createDocumentFragment();
    const b = document.createElement("b");
    b.textContent = m[1];
    frag.appendChild(b);
    frag.appendChild(document.createTextNode(s.slice(m[1].length)));
    return frag;
}

// 「；」分隔的多条建议渲染成列表，每条首个分句加粗
function guideList(text, cls)
{
    const ul = document.createElement("ul");
    if (cls) ul.className = cls;
    String(text || "").split("；").filter(Boolean).forEach((x) => {
        const li = document.createElement("li");
        li.appendChild(boldLead(x));
        ul.appendChild(li);
    });
    return ul;
}

// ===== 当前可见数据（分类 + 大型库 + 搜索） =====
function visibleRows()
{
    const inclLarge = document.getElementById("inclLarge").checked;
    const kw = q.trim().toLowerCase();
    return DATA.filter((r) => {
        const repo = r[0], category = r[1], large = r[3], note = r[5], use = r[6], skip = r[7];
        if (cat !== "全部" && category !== cat) return false;
        if (large && !inclLarge) return false;
        if (!kw) return true;
        return (repo + " " + category + " " + note + " " + use + " " + skip).toLowerCase().indexOf(kw) >= 0;
    });
}

// ===== 选型表：与卡片共用同一份 DATA，保证只有一处维护 =====
function renderSelTable()
{
    const t = document.getElementById("selTable");
    if (!t) return;
    t.innerHTML = "";
    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    ["库", "分类", "什么时候用", "什么时候不要用"].forEach((h) => {
        const th = document.createElement("th");
        th.textContent = h;
        trh.appendChild(th);
    });
    thead.appendChild(trh);
    t.appendChild(thead);

    const tbody = document.createElement("tbody");
    visibleRows().forEach((r) => {
        const repo = r[0], category = r[1], skills = r[4], note = r[5], use = r[6], skip = r[7];
        const tr = document.createElement("tr");

        const c1 = document.createElement("td");
        const nameEl = document.createElement("div");
        nameEl.className = "r";
        nameEl.textContent = repo;
        c1.appendChild(nameEl);
        const descEl = document.createElement("div");
        descEl.className = "d";
        descEl.textContent = note + (skills ? " · " + skills + " 个技能" : "");
        c1.appendChild(descEl);
        tr.appendChild(c1);

        const c2 = document.createElement("td");
        c2.className = "cat2";
        c2.textContent = category;
        tr.appendChild(c2);

        const c3 = document.createElement("td");
        c3.appendChild(guideList(use));
        tr.appendChild(c3);

        const c4 = document.createElement("td");
        c4.appendChild(guideList(skip, "no"));
        tr.appendChild(c4);

        tbody.appendChild(tr);
    });
    t.appendChild(tbody);

    if (tbody.children.length === 0)
    {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 4;
        td.className = "empty-tip";
        td.textContent = "没有匹配的库，试试清空搜索或勾选「包含大型库」。";
        tr.appendChild(td);
        tbody.appendChild(tr);
    }
}

function buildCardGuide(use, skip)
{
    const d = document.createElement("details");
    d.className = "cg";
    const s = document.createElement("summary");
    s.textContent = "什么时候用 / 不要用";
    d.appendChild(s);
    d.appendChild(guideList(use));
    d.appendChild(guideList(skip, "no"));
    return d;
}

function render()
{
    const rows = visibleRows();
    const g = document.getElementById("grid");
    g.innerHTML = "";
    rows.forEach((r) => {
        const repo = r[0], upstream = r[2], large = r[3], skills = r[4], note = r[5], use = r[6], skip = r[7];
        const c = document.createElement("div");
        c.className = "card";
        c.dataset.repo = repo;
        if (sel.has(repo)) c.classList.add("sel");
        if (installed(repo)) c.classList.add("installed");

        let head = '<div class="r1">'
            + '<input type="checkbox"' + (sel.has(repo) ? " checked" : "") + '>'
            + '<div class="name">' + esc(repo) + "</div>";
        if (installed(repo)) head += '<span class="badge inst">已安装</span>';
        if (large) head += '<span class="badge large">大型库</span>';
        head += "</div>";

        let meta = '<div class="meta">';
        meta += skills ? '<span class="sk">' + skills + " 个技能</span>" : "<span>技能数未知</span>";
        if (upstream) meta += '<a href="https://github.com/' + esc(upstream) + '" target="_blank" rel="noopener">上游 ↗</a>';
        meta += '<a class="ccs" href="' + esc(ccsLink(repo)) + '" title="把本库注册为 CC Switch 的 Skill 仓库（一库一条记录，库内技能自动同步）">导入 CC Switch ↗</a>';
        meta += "</div>";

        c.innerHTML = head + '<div class="note">' + esc(note) + "</div>" + meta;
        c.querySelector("input").onchange = (e) => { toggle(repo, e.target.checked); };
        c.appendChild(buildCardGuide(use, skip));
        g.appendChild(c);
    });

    if (rows.length === 0)
    {
        const p = document.createElement("div");
        p.className = "empty-tip";
        p.textContent = "没有匹配的库，试试清空搜索或勾选「包含大型库」。";
        g.appendChild(p);
    }

    document.getElementById("resCnt").innerHTML = "显示 <b>" + rows.length + "</b> / " + DATA.length;
    renderSelTable();
    updateCnt();
}

function toggle(repo, on)
{
    if (on) sel.add(repo); else sel.delete(repo);
    localStorage.setItem("wl-sel", JSON.stringify(Array.from(sel)));
    const card = Array.prototype.slice.call(document.querySelectorAll(".card")).filter((x) => x.dataset.repo === repo)[0];
    if (card) card.classList.toggle("sel", on);
    updateCnt();
    buildCmd();
}

function updateCnt()
{
    document.getElementById("cnt").textContent = sel.size;
    document.getElementById("fabCnt").textContent = sel.size;
    document.getElementById("instCnt").textContent = DATA.filter((r) => installed(r[0])).length;
}

function applyView()
{
    document.getElementById("grid").style.display = view === "cards" ? "" : "none";
    document.getElementById("tableWrap").style.display = view === "table" ? "" : "none";
    Array.prototype.slice.call(document.querySelectorAll("#viewSeg button")).forEach((b) => {
        b.classList.toggle("on", b.dataset.view === view);
    });
    render();
}

// ===== 底部命令生成 =====
function depArgs(repos)
{
    const win = os === "win";
    const root = document.getElementById("root").value.trim();
    const a = [];
    if (repos.length === DATA.length) a.push(win ? "-All" : "--all");
    else a.push((win ? "-Repo " : "--repo ") + repos.join(","));
    if (root) a.push((win ? "-Root " : "--root ") + root);
    a.push(win ? "-NonInteractive" : "--non-interactive");
    return a.join(" ");
}

function buildCmd()
{
    const out = document.getElementById("cmdOut");
    const hint = document.getElementById("hint");
    const win = os === "win";
    const repos = Array.from(sel);

    if (act === "scan")
    {
        hint.textContent = "扫描本机已安装技能";
        out.textContent = win ? "deploy.cmd -Action scan -Json" : "./deploy.sh --action scan --json";
        return;
    }
    if (repos.length === 0)
    {
        hint.textContent = "";
        out.textContent = "（尚未选择任何技能仓）";
        return;
    }

    hint.textContent = act === "disable" ? "停用：从目标项目 .trae/skills 移除，技能库本身保留" : "已选 " + repos.length + " 个库";
    const args = depArgs(repos);

    if (act === "enable" || act === "disable")
    {
        // 启用 / 停用都作用在目标项目的 .trae/skills，只需仓库范围与项目路径
        const base = (win ? "deploy.cmd -Action " + act + " " : "./deploy.sh --action " + act + " ") + args
            + (win ? " -Project .." : " --project ..");
        out.textContent = "# 在目标项目根目录执行（-Project 指向该目录；部署仓克隆在其下时用 ..）\n" + base;
        return;
    }

    const step1 = "# 1) 克隆部署仓（已克隆可跳过）\n" + "git clone " + REPO_URL + "\ncd aukodeng-wife-legal-auto-download";
    const action = win ? "deploy.cmd -Action " + act + " " + args : "./deploy.sh --action " + act + " " + args;
    out.textContent = step1 + "\n\n# 2) " + ({ install: "安装", update: "更新", uninstall: "删除" }[act] || act) + "\n" + action
        + (act === "install" ? "\n\n# 3) 启用进目标项目（在项目根目录执行，部署仓在其下时用 ..）\n" + (win ? "deploy.cmd -Action enable " + args + " -Project .." : "./deploy.sh --action enable " + args + " --project ..") : "");
}

// ===== 下载 ZIP：把勾选的技能库打包成可直接导入 CC Switch 的压缩包 =====
// 每个仓库打成一个技能库目录 wife-legal-<仓库名>：CC Switch 的「从 ZIP 安装」按目录里的
// SKILL.md 识别技能，且遇到含 SKILL.md 的目录就不再往里扫，所以库目录根部必须有 SKILL.md
//（仓库自己没有就补一个），库内的子技能原样留在子目录里，由根部这份索引说明。
const ZIP_ORG = "aukodeng-skill";
const ZIP_RAW = "https://raw.githubusercontent.com/" + ZIP_ORG + "/";
const ZIP_CDN = "https://cdn.jsdelivr.net/gh/" + ZIP_ORG + "/";
const ZIP_TREE = "https://data.jsdelivr.com/v1/packages/gh/" + ZIP_ORG + "/";
const ZIP_API = "https://api.github.com/repos/" + ZIP_ORG + "/";
const ZIP_MAX_FILES = 1500;   // 单个仓库的文件数上限，超出的建议改用脚本部署
const ZIP_POOL = 8;           // 并发下载数
let zipBusy = false;

// ===== 导入 CC Switch 仓库：用官方深链接把每个库注册成一个 Skill 仓库 =====
// resource=skill 的深链接添加的是「Skill 仓库」而不是直接安装技能；注册后 CC Switch
// 按仓库里的 SKILL.md 列出库内全部技能，所以一个库就是一条记录、内含 N 个技能
const CCS_SCHEME = "ccswitch://v1/import?resource=skill&repo=";
const CCS_GAP = 1500;   // 连续唤起 CC Switch 的间隔，太快会被浏览器/系统丢掉
let ccsBusy = false;
let ccsTimer = null;

function ccsLink(lib)
{
    return CCS_SCHEME + encodeURIComponent(ZIP_ORG + "/" + lib) + "&branch=main";
}

function showCcsMsg(html)
{
    const el = document.getElementById("ccsMsg");
    el.innerHTML = html;
    el.classList.toggle("show", !!html);
}

function openCcs(lib)
{
    const a = document.createElement("a");
    a.href = ccsLink(lib);
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
}

function stopCcs(done)
{
    ccsBusy = false;
    if (ccsTimer)
    {
        clearTimeout(ccsTimer);
        ccsTimer = null;
    }
    document.getElementById("ccsBtn").textContent = "导入 CC Switch 仓库";
    if (!done) showCcsMsg("");
}

// 依次唤起 CC Switch：每个库都会弹一次确认框，确认后回到本页等下一个
function importToCcs()
{
    if (ccsBusy)
    {
        stopCcs(false);
        toast("已停止导入");
        return;
    }

    const libs = Array.from(sel);
    if (libs.length === 0)
    {
        toast("先勾选要导入的技能库");
        return;
    }

    let i = 0;
    ccsBusy = true;
    document.getElementById("ccsBtn").textContent = "停止导入";

    const step = () =>
    {
        if (!ccsBusy) return;
        if (i >= libs.length)
        {
            stopCcs(true);
            showCcsMsg("<b>已发起 " + libs.length + " 个库的导入</b><br>全部确认后，到 CC Switch 的「Skills」页选择要安装的技能。");
            toast("已发起 " + libs.length + " 个库的导入");
            return;
        }
        const lib = libs[i++];
        openCcs(lib);
        showCcsMsg("正在导入 <b>" + i + " / " + libs.length + "</b>：" + esc(lib)
            + "<br>在 CC Switch 弹窗里点「确认」，确认完回到本页等下一个（每个库都要确认一次）。");
        ccsTimer = setTimeout(step, CCS_GAP);
    };
    step();
}

// 按需加载 JSZip，避免影响首屏
function loadJSZip()
{
    if (window.JSZip) return Promise.resolve(window.JSZip);
    return new Promise((resolve, reject) =>
    {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
        s.onload = () => resolve(window.JSZip);
        s.onerror = () => reject(new Error("JSZip 加载失败，请确认能访问 cdn.jsdelivr.net"));
        document.head.appendChild(s);
    });
}

// 结果区：显示打包摘要与跳过原因
function showZipMsg(html)
{
    const el = document.getElementById("zipMsg");
    el.innerHTML = html;
    el.classList.toggle("show", !!html);
}

// 用 GitHub API 读文件清单：先试 main，再试 master，最后查默认分支
async function fetchTreeByApi(repo)
{
    for (const b of ["main", "master"])
    {
        const res = await fetch(ZIP_API + repo + "/git/trees/" + b + "?recursive=1");
        if (res.ok)
        {
            const data = await res.json();
            if (data.truncated) throw new Error("仓库太大，GitHub 只返回了部分文件，请改用脚本部署");
            return { branch: b, paths: (data.tree || []).filter((e) => e.type === "blob").map((e) => e.path) };
        }
        if (res.status === 403 || res.status === 429) throw new Error("RATE_LIMIT");
    }
    const info = await fetch(ZIP_API + repo);
    if (!info.ok) throw new Error("读不到仓库信息（HTTP " + info.status + "）");
    const def = (await info.json()).default_branch || "main";
    const res = await fetch(ZIP_API + repo + "/git/trees/" + def + "?recursive=1");
    if (!res.ok) throw new Error("读不到文件清单（HTTP " + res.status + "）");
    const data = await res.json();
    if (data.truncated) throw new Error("仓库太大，GitHub 只返回了部分文件，请改用脚本部署");
    return { branch: def, paths: (data.tree || []).filter((e) => e.type === "blob").map((e) => e.path) };
}

// 用 jsdelivr 读文件清单：没有速率限制，作为 GitHub API 限速时的备选（内容可能有缓存延迟）
async function fetchTreeByCdn(repo)
{
    for (const b of ["main", "master"])
    {
        const res = await fetch(ZIP_TREE + repo + "@" + b + "?structure=flat");
        if (!res.ok) continue;
        const data = await res.json();
        const paths = (data.files || [])
            .map((f) => String(f.name || "").replace(/^\//, ""))
            .filter((p) => p);
        if (paths.length) return { branch: b, paths: paths };
    }
    throw new Error("读不到文件清单");
}

// 优先 GitHub API（内容最新），限速时自动改用 jsdelivr
async function loadRepoFiles(repo)
{
    try
    {
        return await fetchTreeByApi(repo);
    }
    catch (err)
    {
        if (err.message !== "RATE_LIMIT") throw err;
        return await fetchTreeByCdn(repo);
    }
}

// 挑出技能目录：含 SKILL.md 的最外层目录，父目录已是技能目录时不再单列
function pickSkillDirs(paths)
{
    const dirs = new Set();
    paths.forEach((p) =>
    {
        if (!/(^|\/)SKILL\.md$/i.test(p)) return;
        dirs.add(p.replace(/\/?SKILL\.md$/i, ""));
    });
    return Array.from(dirs).filter((d) =>
    {
        if (d === "") return true;
        const parts = d.split("/");
        for (let i = 1; i < parts.length; i++)
        {
            if (dirs.has(parts.slice(0, i).join("/"))) return false;
        }
        return true;
    });
}

// 生成库入口 SKILL.md：CC Switch 只把库目录当成一条技能记录，库内子技能靠这份索引定位
function libSkillMd(repo, dirs, hasUpstream)
{
    const row = DATA.find((r) => r[0] === repo) || [];
    const note = row[5] || "";
    const upstream = row[2] || "";
    const desc = (note ? note + "；" : "")
        + "本库收录 " + dirs.length + " 个法律技能，按用户任务从库内子目录取对应 SKILL.md 使用。";
    const head = [
        "---",
        "name: " + repo,
        "description: " + desc,
        "---",
        "",
        "# " + repo,
        "",
        note,
        "",
        "来源仓库：" + upstream + "；库内共 " + dirs.length + " 个技能。",
        ""
    ];
    if (hasUpstream)
    {
        head.push("原仓库的入口说明保留在同目录的 `UPSTREAM.md`，其中的相对路径均相对本库根目录。", "");
    }
    head.push("## 技能索引", "");
    // 根目录本身也含 SKILL.md 时 pickSkillDirs 会返回空字符串，它不是子目录，不进索引
    const subs = dirs.filter((d) => d !== "");
    const items = subs.length
        ? subs.map((d) => "- `" + d + "/` —— " + d.split("/").pop())
        : ["- 本库根目录的 `SKILL.md` 即唯一技能，直接按上面的说明使用。"];
    const tail = [
        "",
        "## 使用方式",
        "",
        "1. 先判断用户要做的事属于哪个技能；",
        "2. 从上表找到对应子目录，读取该目录下的 `SKILL.md`；",
        "3. 按该 SKILL.md 的说明执行，需要模板或脚本时读取同目录内的文件。"
    ];
    return head.concat(items, tail).join("\n");
}

function encodePath(p)
{
    return p.split("/").map(encodeURIComponent).join("/");
}

// 取单个文件：优先 raw（无缓存），失败改用 jsdelivr CDN
async function fetchBlob(repo, branch, path)
{
    const enc = encodePath(path);
    let res = await fetch(ZIP_RAW + repo + "/" + branch + "/" + enc);
    if (!res.ok) res = await fetch(ZIP_CDN + repo + "@" + branch + "/" + enc);
    if (!res.ok) throw new Error("下载失败 " + repo + "/" + path + "（HTTP " + res.status + "）");
    return res.arrayBuffer();
}

// 固定并发跑完一批任务
async function runPool(items, worker, limit)
{
    let i = 0;
    const runners = [];
    for (let k = 0; k < Math.min(limit, items.length); k++)
    {
        runners.push((async () =>
        {
            while (i < items.length)
            {
                const cur = items[i++];
                await worker(cur);
            }
        })());
    }
    await Promise.all(runners);
}

async function downloadZip()
{
    if (zipBusy) return;
    const repos = Array.from(sel);
    if (repos.length === 0)
    {
        toast("先勾选要下载的技能库");
        return;
    }

    const btn = document.getElementById("zipBtn");
    const label = btn.textContent;
    zipBusy = true;
    btn.disabled = true;
    btn.textContent = "准备中…";
    showZipMsg("");

    const skipped = [];
    let skillTotal = 0;
    let libTotal = 0;
    try
    {
        const JSZip = await loadJSZip();
        const zip = new JSZip();
        let fileDone = 0;
        let fileAll = 0;

        // 第一轮：读文件树，算出要打包的清单
        const plan = [];
        for (const repo of repos)
        {
            btn.textContent = "读取 " + repo + "…";
            let info;
            try
            {
                info = await loadRepoFiles(repo);
            }
            catch (err)
            {
                skipped.push(repo + "：" + err.message);
                continue;
            }

            const dirs = pickSkillDirs(info.paths);
            if (dirs.length === 0)
            {
                skipped.push(repo + "：仓库里没有 SKILL.md");
                continue;
            }

            const lib = "wife-legal-" + repo;
            const hasUpstream = info.paths.some((p) => /^SKILL\.md$/i.test(p));
            // 仓库根自带 SKILL.md 时改名为 UPSTREAM.md 保留原文，库根统一用生成的入口，
            // 这样 CC Switch 里显示的库名始终是页面上的库名，而不是上游仓库的自定义 name
            const jobs = info.paths.map((p) => ({
                repo: repo,
                branch: info.branch,
                src: p,
                dst: lib + "/" + (hasUpstream && /^SKILL\.md$/i.test(p) ? "UPSTREAM.md" : p)
            }));

            if (jobs.length > ZIP_MAX_FILES)
            {
                skipped.push(repo + "：共 " + jobs.length + " 个文件，超过单库上限 " + ZIP_MAX_FILES + "，请改用脚本部署");
                continue;
            }

            jobs.push({ text: libSkillMd(repo, dirs, hasUpstream), dst: lib + "/SKILL.md" });

            skillTotal += dirs.length;
            libTotal++;
            fileAll += jobs.length;
            plan.push.apply(plan, jobs);
        }

        if (plan.length === 0) throw new Error("没有可打包的技能");

        // 第二轮：并发下载并写入 zip
        await runPool(plan, async (t) =>
        {
            // 自动生成的库入口 SKILL.md 没有远端文件，直接写文本
            zip.file(t.dst, t.text !== undefined ? t.text : await fetchBlob(t.repo, t.branch, t.src));
            fileDone++;
            btn.textContent = "下载 " + fileDone + "/" + fileAll;
        }, ZIP_POOL);

        btn.textContent = "打包中…";
        const blob = await zip.generateAsync(
            { type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } },
            (meta) => { btn.textContent = "压缩 " + Math.round(meta.percent) + "%"; }
        );

        const d = new Date();
        const stamp = d.getFullYear() + ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "wife-legal-skills-" + stamp + ".zip";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);

        let msg = "<b>已生成 ZIP</b>：" + libTotal + " 个技能库（内含 " + skillTotal + " 个技能）、"
            + fileAll + " 个文件、" + (blob.size / 1048576).toFixed(1) + " MB<br>"
            + "导入方式：CC Switch → Skills → 添加 Skill → 从 ZIP 安装，每个库显示为一条记录";
        if (skipped.length)
        {
            msg += '<br><span class="warn">跳过 ' + skipped.length + " 个库：</span><br>" + skipped.map(esc).join("<br>");
        }
        showZipMsg(msg);
        toast("ZIP 已下载，可在 CC Switch 里「从 ZIP 安装」");
    }
    catch (err)
    {
        showZipMsg('<span class="warn">打包失败：</span>' + esc(err.message));
        toast("打包失败：" + err.message);
    }
    finally
    {
        btn.disabled = false;
        btn.textContent = label;
        zipBusy = false;
    }
}

    scanModal.classList.add("open");
};
document.getElementById("scanClose").onclick = () => scanModal.classList.remove("open");
scanModal.onclick = (e) => { if (e.target === scanModal) scanModal.classList.remove("open"); };
document.getElementById("scanPick").onclick = () => document.getElementById("scanFile").click();
document.getElementById("scanFile").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { document.getElementById("scanInput").value = rd.result; };
    rd.readAsText(f);
};
document.getElementById("scanImport").onclick = () => {
    const t = document.getElementById("scanInput").value.trim();
    if (!t) { toast("先粘贴扫描结果 JSON"); return; }
    try { scanState = JSON.parse(t); }
    catch (err) { toast("JSON 解析失败：" + err.message); return; }
    localStorage.setItem("wl-scan", JSON.stringify(scanState));
    scanModal.classList.remove("open");
    const n = DATA.filter((r) => installed(r[0])).length;
    document.getElementById("scanInfo").textContent = "已导入本地状态：识别到 " + n + " 个已安装技能库。";
    render();
    toast("本地状态已导入");
};

window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.getElementById("cmdpanel").classList.remove("open");
});

window.addEventListener("scroll", () => {
    document.getElementById("toolbar").classList.toggle("stuck", window.scrollY > 8);
});

// ===== 初始化 =====
renderCats();
applyView();
buildCmd();
</script>
</body>
</html>
